name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daml:
    name: Daml 3.4.10 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.daml
          key: daml-${{ runner.os }}-3.4.10
      - name: Install Daml SDK 3.4.10
        run: |
          if [ ! -x "$HOME/.daml/bin/daml" ]; then
            curl --fail --silent --show-error --location https://get.daml.com/ | sh -s 3.4.10
          fi
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - name: Build wallet DAR
        working-directory: daml-starter
        run: daml build
      - name: Run Daml Script tests
        working-directory: daml-starter-test
        run: daml test

  python:
    name: Python 3.9 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile source
        run: python -m compileall -q canton8_agent agent_wallet_mvp.py agent_wallet_localnet.py c8lab.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  web:
    name: Next.js checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:route
